site_name: fastauth
site_description: A modular, Pydantic-native, async-only authentication library for FastAPI.
site_url: https://bhargavandhe.github.io/fastauth/
repo_url: https://github.com/bhargavandhe/fastauth
strict: true

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]

nav:
  - Introduction: index.md
  - Installation: installation.md
  - Quickstart: quickstart.md
  - Concepts:
      - Configuration: concepts/config.md
      - Adapters: concepts/adapters.md
      - Sessions: concepts/sessions.md
      - Server API: concepts/server-api.md
      - Hooks: concepts/hooks.md
      - Events: concepts/events.md
      - Plugins: concepts/plugins.md
      - CSRF: concepts/csrf.md
      - Rate limiting: concepts/rate-limit.md
  - Plugins:
      - API keys: plugins/api-key.md
      - JWT: plugins/jwt.md
      - Email OTP: plugins/email-otp.md
      - Audit logs: plugins/audit-logs.md
      - OpenAPI / Scalar: plugins/openapi.md
      - Test utils: plugins/test-utils.md
  - Guides:
      - Migrating to 0.12: migrating/0.12.md
      - Migrating to 0.11: migrating/0.11.md
      - Email verification: guides/email-verification.md
      - Password reset: guides/password-reset.md
      - User management: guides/user-management.md
      - Bearer auth: guides/bearer-auth.md
      - KMS signing: guides/kms-signing.md
      - Deploying: guides/deploying.md
  - Reference: reference/index.md
