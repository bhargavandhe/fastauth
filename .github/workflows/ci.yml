name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: Lint and type check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev --extra jwt --extra cli --extra beanie --extra postgres
      - run: uv run --extra dev --extra jwt --extra cli --extra beanie --extra postgres ruff format --check src tests examples docs .github/scripts
      - run: uv run --extra dev --extra jwt --extra cli --extra beanie --extra postgres ruff check src tests examples .github/scripts
      - run: uv run --extra dev --extra jwt --extra cli --extra beanie --extra postgres pyright

  tests:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev --extra jwt --extra cli --extra beanie --extra postgres
      - run: >
          uv run --extra dev --extra jwt --extra cli --extra beanie --extra postgres pytest
          tests/unit
          tests/integration
          tests/cli
          tests/adapters/test_memory_adapter.py
          --cov-fail-under=80

  docker-tests:
    name: Docker-backed adapter tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev --extra jwt --extra cli --extra beanie --extra postgres
      - run: >
          uv run --extra dev --extra jwt --extra cli --extra beanie --extra postgres pytest
          tests/adapters/test_beanie_adapter.py
          tests/adapters/test_postgres_adapter.py
          examples/quickstart/tests
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          FASTAUTH_REQUIRE_DATABASES: "1"

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --extra docs --extra dev --extra beanie --extra postgres
      - run: uv run --no-sync mkdocs build --strict
      - run: uv run --no-sync pytest tests/docs --no-cov
      - run: uv run --no-sync pyright examples/deployment

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv build
      - run: uvx twine check dist/*

  consumer-installs:
    name: Consumer wheels (${{ matrix.python-version }}, ${{ matrix.resolution }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        resolution: ["highest"]
        include:
          # Test direct dependency floors on the minimum supported interpreter.
          # Latest-compatible dependencies run on every supported interpreter.
          - python-version: "3.11"
            resolution: "lowest-direct"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv build
      - name: Resolve and exercise core and every extra in independent environments
        run: |
          for extra in core beanie postgres jwt cli testing docs dev; do
            python .github/scripts/check_distribution.py \
              --extra "$extra" --resolution "${{ matrix.resolution }}"
          done
